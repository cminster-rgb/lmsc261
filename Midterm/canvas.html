<!DOCTYPE html>
<body>
    <canvas width="600" height="600" id="canvas" style="width: 600px; height: 600px;"></canvas>
</body>

<script>
    
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const w = canvas.width, h = canvas.height;

    const dpr = window.devicePixelRatio || 1;
    canvas.width *= dpr, canvas.height *= dpr;
    ctx.scale(dpr, dpr);


    let colorIndex = 0;
    const colors = ['green', 'blue', 'red', 'orange', 'pink']

    function drawpacman() {
        // Clear the previous frame so the colors don't stack up over each other
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.beginPath();
        ctx.arc(
            300, // x-position coordinate
            300, // y-position coordinate
            300, // radius of circle
            0, // starting angle
            Math.PI * 2, // ending angle
            false // clockwise or not 
        );
        // 2. Define state variables for colors


        // Update the fill color to the current index selection
        ctx.fillStyle = colors[colorIndex];
        ctx.fill(); // render the circle

        ctx.beginPath();
        ctx.arc(
            200, // x-position coordinate
            200, // y-position coordinate
            50, // radius of circle
            0, // starting angle
            Math.PI * 2, // ending angle
            false // clockwise or not 
        );
        ctx.fillStyle = "black"; // color of circle
        ctx.fill(); // render the circle

        ctx.beginPath();
        ctx.arc(
            600, // x-position coordinate
            300, // y-position coordinate
            250, // radius of circle
            0, // starting angle
            Math.PI * 2, // ending angle
            false // clockwise or not
        );
        ctx.fillStyle = "white";
        ctx.fill();   
    }
    drawpacman();

    // 4. Add the click event listener to the canvas element
    canvas.addEventListener('click', (e) => {
        // Cycle to the next color in the array
        colorIndex = (colorIndex + 1) % colors.length;

        // 5. Run the initial draw call when the page first loads
        drawpacman();
    })

</script>
