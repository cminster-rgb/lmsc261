<!DOCTYPE html>
<body>
    <canvas width="600" height="600" id="canvas" style="width: 600px; height: 600px;"></canvas>
</body>

<script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const w = canvas.width, h = canvas.height;

    const dpr = window.devicePixelRatio || 1;
    canvas.width *= dpr, canvas.height *= dpr;
    ctx.scale(dpr, dpr);



// let numCircles = prompt("How many circles?");
//const maxRadius = w * 0.45;
//const radiusIncr = maxRadius / numCircle;

for(let i = 0; i < 200; i++){
    let xPos = Math.random() * w;
    let yPos = Math.random() * h;

    ctx.beginPath();
    ctx.arc(
        xPos, // x-position coordinate
        yPos, // y-position coordinate
        20, // radius of circle
        0, // starting angle
        Math.PI * 2, // ending angle
        false // clockwise or not 
    );
    ctx.fillStyle = "blue"; // color of circle
    ctx.fill(); // render the circle
}
</script>
